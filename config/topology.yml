# Topology - the single source of truth for scripts/*.sh and the mirror of the stage list in apic-ci.yml.
#
# instance = one API Connect installation (own cluster, management endpoint, credentials). Credentials come from
#            the Azure DevOps variable group `apic-<instance>` (APIC_SERVER, APIC_ORG, APIC_APIKEY) and the
#            Secure File `apic-toolkit-credentials-<instance>.json`.
# folder   = projects/<project>/<folder>/{apis,products}/ - a version of the project's definitions.
#            Moving a version between folders is a promotion PR (scripts/promote.sh).
# stage    = publishes ONE folder to ONE catalog on ONE instance. The git tag `published/<stage>` marks the
#            last commit published there; the Azure DevOps Environment `apic-<stage>` carries the gate.
#   trigger: merge     - runs automatically when the folder changed on main
#            approval  - runs after a human approves on the Environment (same run as the merge)
#            schedule  - runs only from the pipeline's cron schedule (or a manual run)
#   after:   stage of the same run that must have succeeded or been skipped first
# catalog  = pattern; {project} is the project folder name. A project can override a name in
#            projects/<project>/project.yaml  ->  catalogs: { <stage>: <catalog-name> }.
instances:
  dev:  { description: Development instance }
  test: { description: Test instance }
  prod: { description: Production instance }

stages:
  - name: dev
    folder: dev
    instance: dev
    catalog: "{project}-dev"
    trigger: merge
  - name: integ
    folder: dev
    instance: dev
    catalog: "{project}-integ"
    trigger: approval
    after: dev
  - name: nightly
    folder: dev                 # the current development state, published every night to the test instance
    instance: test
    catalog: "{project}-nightly"
    trigger: schedule
  - name: rc
    folder: test                # a deliberately promoted release candidate (promotion PR dev -> test)
    instance: test
    catalog: "{project}-rc"
    trigger: approval
  - name: prod
    folder: prod                # promotion PR test -> prod
    instance: prod
    catalog: "{project}"
    trigger: approval
