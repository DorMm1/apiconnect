# Stage 1 - YAML syntax/style. Kept intentionally lenient: this stage is about
# "is it valid YAML that a machine can load", not formatting opinions.
extends: default

rules:
  line-length: disable
  document-start: disable
  document-end: disable
  comments-indentation: disable
  indentation:
    spaces: consistent
    indent-sequences: whatever
  truthy:
    # APIC definitions contain keys such as `enforced: true`; only accept real booleans
    allowed-values: ['true', 'false']
    check-keys: false
  comments:
    min-spaces-from-content: 1
  # Hard errors that would break `apic validate` / the OAS parsers
  key-duplicates: enable
  quoted-strings: disable
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: false
