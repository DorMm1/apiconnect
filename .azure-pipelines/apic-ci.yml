# APIConnect-catalog - GitOps pipeline for IBM API Connect 10.0.8.x, Azure DevOps.
#
# Topology (config/environments.yml): three API Connect INSTANCES, each with its own endpoint and credentials,
# and per project the catalogs
#     dev  instance : <project>-dev      -> <project>-integ
#     test instance : <project>-nightly  -> <project>-rc
#     prod instance : <project>
# Repository folder projects/<project>/<env>/ holds what the <env> instance should have. Both catalogs of an
# instance receive the SAME files, in order, the second one behind an approval gate.
#
#   Pull request -> main : Validate only (stages 1-4) for every environment folder touched. No call writes to APIC.
#   Push to main         : Validate, then three independent publish chains, each stage skipped when its
#                          environment folder has nothing new since the tag published/<stage>:
#                              publish_dev -> publish_integ        (dev instance)
#                              publish_nightly -> publish_rc       (test instance)
#                              publish_prod                        (prod instance)
#
# Required Azure DevOps setup (README "Azure DevOps setup"):
#   Variable group  apic-shared              : APIC_TOOLKIT_VERSION, TOOLS_MODE (online|offline)
#   Variable groups apic-dev / apic-test / apic-prod : APIC_SERVER, APIC_ORG (plain), APIC_APIKEY (secret, Key Vault)
#   Secure files    apic-toolkit-credentials-dev.json / -test.json / -prod.json
#   Environments    apic-dev, apic-integ, apic-nightly, apic-rc, apic-prod (approvals + exclusive lock where wanted)

trigger:
  branches:
    include: [main]
  paths:
    include: [projects/**, config/**, scripts/**, .azure-pipelines/**]

# `pr:` applies to GitHub-hosted repos. For Azure Repos, add a branch policy "Build validation" on main instead.
pr:
  branches:
    include: [main]
  paths:
    include: [projects/**, config/**, scripts/**, .azure-pipelines/**]

variables:
- group: apic-shared

stages:
# --------------------------------------------------------------------------------------------- validate
- stage: validate
  displayName: Validate (stages 1-4)
  jobs:
  - job: validate
    displayName: yaml -> openapi -> apic -> compatibility
    pool:
      vmImage: ubuntu-latest          # on-prem: replace with  name: <your agent pool>
    steps:
    - checkout: self
      fetchDepth: 0                   # full history: needed to diff against the target branch / tags

    - template: templates/install-tools.yml

    - bash: |
        set -euo pipefail
        git fetch -q origin '+refs/tags/published/*:refs/tags/published/*' 2>/dev/null || true
        if [[ "$BUILD_REASON" == "PullRequest" ]]; then
          TB="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git fetch -q origin "+refs/heads/${TB}:refs/remotes/origin/${TB}"
          scripts/changeset.sh --mode pr --base "origin/${TB}" out/cs
          # PR builds never publish: report every stage as "no changes"
          for s in dev integ nightly rc prod; do echo "##vso[task.setvariable variable=${s};isOutput=true]false"; done
        else
          scripts/changeset.sh --mode main out/cs
          while read -r stage flag; do
            echo "##vso[task.setvariable variable=${stage};isOutput=true]${flag}"
          done < out/cs/stages.txt
        fi
        if [[ -s out/cs/products.txt ]]; then
          echo "##vso[task.setvariable variable=HAS_CHANGES]true"
        else
          echo "##vso[task.setvariable variable=HAS_CHANGES]false"
          echo "##vso[task.logissue type=warning]No API/product changes detected - validation stages skipped"
        fi
      name: changes
      displayName: '0 · Change set per environment'

    - bash: scripts/validate-yaml.sh out/cs/products.txt out/cs/apis.txt
      displayName: '1 · YAML syntax (yamllint)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - bash: scripts/validate-oas.sh out/cs/apis.txt
      displayName: '2 · OpenAPI 3.0 validity (spectral)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - bash: scripts/validate-apic.sh out/cs/products.txt
      displayName: '3 · APIC validity (apic validate)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - bash: scripts/validate-compat.sh out/cs
      displayName: '4 · Backward compatibility per environment (oasdiff)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - task: PublishTestResults@2
      displayName: Publish lint/compat results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'out/**/*.xml'
        failTaskOnFailedTests: false
        testRunTitle: apic-validation

    - publish: out/cs
      artifact: change-set
      displayName: Publish change set
      condition: always()

# --------------------------------------------------------------------------------------------- dev instance
- template: templates/publish-stage.yml
  parameters:
    env: dev
    stage: dev
    catalog: '<project>-dev'
    dependsOn: [validate]

- template: templates/publish-stage.yml
  parameters:
    env: dev
    stage: integ
    catalog: '<project>-integ'
    dependsOn: [validate, publish_dev]
    previousStage: publish_dev

# --------------------------------------------------------------------------------------------- test instance
- template: templates/publish-stage.yml
  parameters:
    env: test
    stage: nightly
    catalog: '<project>-nightly'
    dependsOn: [validate]

- template: templates/publish-stage.yml
  parameters:
    env: test
    stage: rc
    catalog: '<project>-rc'
    dependsOn: [validate, publish_nightly]
    previousStage: publish_nightly

# --------------------------------------------------------------------------------------------- prod instance
- template: templates/publish-stage.yml
  parameters:
    env: prod
    stage: prod
    catalog: '<project>'
    dependsOn: [validate]
