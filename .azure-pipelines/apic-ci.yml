# APIConnect-catalog - GitOps pipeline for IBM API Connect 10.0.8.x, Azure DevOps.
#
# Topology (config/topology.yml - keep the stage list below in sync with it):
#   folder  projects/<project>/dev/    -> stage dev      -> <project>-dev      on the dev  instance
#                                      -> stage nightly  -> <project>-nightly  on the test instance   (same files)
#   folder  projects/<project>/integ/  -> stage integ    -> <project>-integ    on the dev  instance
#   folder  projects/<project>/rc/     -> stage rc       -> <project>-rc       on the test instance
#   folder  projects/<project>/prod/   -> stage prod     -> <project>          on the prod instance
#
#   Pull request -> main : Validate only (stages 1-4) for every folder touched. No call writes to APIC.
#   Merge to main        : Validate, then every publish stage whose folder changed since its tag published/<stage>;
#                          the others are Skipped. All five stages are independent and run in parallel.
#   Ingress URLs / org of each instance come from config/topology.yml; only the API key and the toolkit
#   credentials.json live in Azure DevOps (variable group apic-<instance>, Secure File).
#
# Required Azure DevOps setup (README "Azure DevOps setup"):
#   Variable group  apic-shared                        : APIC_TOOLKIT_VERSION, TOOLS_MODE (online|offline)
#   Variable groups apic-dev / apic-test / apic-prod   : APIC_APIKEY (secret, Key Vault)
#   Secure files    apic-toolkit-credentials-dev.json / -test.json / -prod.json
#   Environments    apic-dev, apic-nightly, apic-integ, apic-rc, apic-prod (approvals optional; exclusive lock recommended)

trigger:
  branches:
    include: [main]
  paths:
    include: [projects/**, config/**, scripts/**, .azure-pipelines/**]

# `pr:` applies to GitHub-hosted repos. For Azure Repos, add a branch policy "Build validation" on main instead.
pr:
  branches:
    include: [main]
  paths:
    include: [projects/**, config/**, scripts/**, .azure-pipelines/**]

variables:
- group: apic-shared

stages:
# --------------------------------------------------------------------------------------------- validate
- stage: validate
  displayName: Validate (stages 1-4)
  jobs:
  - job: validate
    displayName: yaml -> openapi -> apic -> compatibility
    pool:
      vmImage: ubuntu-latest          # on-prem: replace with  name: <your agent pool>
    steps:
    - checkout: self
      fetchDepth: 0                   # full history: needed to diff against the target branch / tags

    - template: templates/install-tools.yml

    - bash: |
        set -euo pipefail
        git fetch -q origin '+refs/tags/published/*:refs/tags/published/*' 2>/dev/null || true
        if [[ "$BUILD_REASON" == "PullRequest" ]]; then
          TB="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git fetch -q origin "+refs/heads/${TB}:refs/remotes/origin/${TB}"
          scripts/changeset.sh --mode pr --base "origin/${TB}" out/cs
          # PR builds never publish: report every stage as "no changes"
          for s in $(yq -r '.stages[].name' config/topology.yml); do echo "##vso[task.setvariable variable=${s};isOutput=true]false"; done
        else
          scripts/changeset.sh --mode main out/cs
          while read -r stage flag; do
            echo "##vso[task.setvariable variable=${stage};isOutput=true]${flag}"
          done < out/cs/stages.txt
        fi
        if [[ -s out/cs/products.txt ]]; then
          echo "##vso[task.setvariable variable=HAS_CHANGES]true"
        else
          echo "##vso[task.setvariable variable=HAS_CHANGES]false"
          echo "##vso[task.logissue type=warning]No API/product changes detected - validation stages skipped"
        fi
      name: changes
      displayName: '0 · Change set per folder'

    - bash: scripts/validate-yaml.sh out/cs/products.txt out/cs/apis.txt
      displayName: '1 · YAML syntax (yamllint)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - bash: scripts/validate-oas.sh out/cs/apis.txt
      displayName: '2 · OpenAPI 3.0 validity (spectral)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - bash: scripts/validate-apic.sh out/cs/products.txt
      displayName: '3 · APIC validity (apic validate)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - bash: scripts/validate-compat.sh out/cs
      displayName: '4 · Backward compatibility per folder (oasdiff)'
      condition: and(succeeded(), eq(variables['HAS_CHANGES'], 'true'))

    - task: PublishTestResults@2
      displayName: Publish lint/compat results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'out/**/*.xml'
        failTaskOnFailedTests: false
        testRunTitle: apic-validation

    - publish: out/cs
      artifact: change-set
      displayName: Publish change set
      condition: always()

# --------------------------------------------------------------------------------------------- dev/ folder
- template: templates/publish-stage.yml
  parameters: { stage: dev, folder: dev, instance: dev, catalog: '<project>-dev' }

- template: templates/publish-stage.yml
  parameters: { stage: nightly, folder: dev, instance: test, catalog: '<project>-nightly' }

# --------------------------------------------------------------------------------------------- integ/ folder
- template: templates/publish-stage.yml
  parameters: { stage: integ, folder: integ, instance: dev, catalog: '<project>-integ' }

# --------------------------------------------------------------------------------------------- rc/ folder
- template: templates/publish-stage.yml
  parameters: { stage: rc, folder: rc, instance: test, catalog: '<project>-rc' }

# --------------------------------------------------------------------------------------------- prod/ folder
- template: templates/publish-stage.yml
  parameters: { stage: prod, folder: prod, instance: prod, catalog: '<project>' }
