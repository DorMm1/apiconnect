# One deployment stage = one publish stage = one folder published to one catalog per project on one instance.
# Instantiated from apic-ci.yml for every stage in config/topology.yml.
#
# Runs when a PR that changed the folder was merged into main (or on a manual run) and the folder has something
# new since the git tag published/<stage>; otherwise the stage is Skipped. Stages are independent of each other.
#
# Instance settings (management ingress = `apic --server`, org) are read from config/topology.yml by
# scripts/stage-env.sh. Secrets come from Azure DevOps: variable group apic-<instance> (APIC_APIKEY) and the
# Secure File apic-toolkit-credentials-<instance>.json.
#
# Approvals / exclusive lock are configured on the Azure DevOps Environment apic-<stage> (optional: the PR review is
# the primary gate).
parameters:
- { name: stage,      type: string }        # dev | nightly | integ | rc | prod -> Environment apic-<stage>, tag published/<stage>
- { name: folder,     type: string }        # dev | integ | rc | prod -> projects/*/<folder>/
- { name: instance,   type: string }        # dev | test | prod -> variable group apic-<instance>, secure file
- { name: catalog,    type: string }        # display only; the real name comes from config/topology.yml / project.yaml
- { name: agentPool,  type: string, default: '' }             # self-hosted pool name; empty = Microsoft-hosted ubuntu-latest
- { name: apicSource, type: string, default: preinstalled }   # preinstalled | artifacts (see install-tools.yml)

stages:
- stage: publish_${{ parameters.stage }}
  displayName: Publish ${{ parameters.stage }} · ${{ parameters.folder }}/ -> ${{ parameters.catalog }} (${{ parameters.instance }} instance)
  dependsOn: [validate]
  condition: >-
    and(
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(dependencies.validate.result, 'Succeeded'),
      eq(dependencies.validate.outputs['validate.changes.${{ parameters.stage }}'], 'true')
    )
  variables:
  - group: apic-${{ parameters.instance }}
  jobs:
  - deployment: publish
    displayName: apic products:publish
    environment: apic-${{ parameters.stage }}
    pool:
      ${{ if ne(parameters.agentPool, '') }}:
        name: ${{ parameters.agentPool }}
      ${{ else }}:
        vmImage: ubuntu-latest
    workspace:
      clean: all
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true          # required to push the published/<stage> tag

          - template: install-tools.yml
            parameters:
              apicSource: ${{ parameters.apicSource }}

          - bash: scripts/stage-env.sh --stage "${{ parameters.stage }}" --vso
            displayName: Resolve instance ingress from config/topology.yml

          - task: DownloadSecureFile@1
            name: apicCreds
            displayName: Toolkit credentials.json of the ${{ parameters.instance }} instance
            inputs:
              secureFile: apic-toolkit-credentials-${{ parameters.instance }}.json

          - bash: |
              set -euo pipefail
              apic client-creds:set "$(apicCreds.secureFilePath)"
              # Non-interactive login with an IBM Cloud IAM API key (v10.0.8 CLI: `apic iam-apikey`).
              # VERIFY on each instance. Alternative for IBMid/OIDC-only instances:
              #   apic login --server "$APIC_SERVER" --sso --context provider --apiKey "$APIC_APIKEY"
              apic iam-apikey --server "$APIC_SERVER" --apiKey "$APIC_APIKEY"
              # Smoke-test the session with a read-only call (also proves org and instance are right)
              apic catalogs:list --server "$APIC_SERVER" --org "$APIC_ORG" --fields name --format yaml --output -
            displayName: apic login (${{ parameters.instance }} instance)
            env:
              APIC_ORG: $(APIC_ORG)
              APIC_SERVER: $(APIC_SERVER)
              APIC_APIKEY: $(APIC_APIKEY)       # secret: only ever passed through env

          - bash: scripts/changeset.sh --mode stage --stage "${{ parameters.stage }}" out/cs
            displayName: Change set of ${{ parameters.folder }}/ since published/${{ parameters.stage }}

          - bash: scripts/compat-check.sh --mode live --stage "${{ parameters.stage }}" out/cs/products.txt
            displayName: "4' Compatibility vs live catalogs"
            env:
              APIC_SERVER: $(APIC_SERVER)
              APIC_ORG: $(APIC_ORG)

          - bash: scripts/publish.sh --stage "${{ parameters.stage }}" out/cs/products.txt
            displayName: apic products:publish
            env:
              APIC_SERVER: $(APIC_SERVER)
              APIC_ORG: $(APIC_ORG)

          - bash: |
              set -euo pipefail
              TAG="published/${{ parameters.stage }}"
              git config user.email "apic-pipeline@noreply.local"
              git config user.name  "apic-pipeline"
              git tag -f "$TAG" HEAD
              git push --force origin "refs/tags/${TAG}"
              echo "Moved $TAG -> $(git rev-parse --short HEAD)"
            displayName: Mark published/${{ parameters.stage }}

          - task: PublishTestResults@2
            displayName: Publish compat results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'out/compat/*.xml'
              failTaskOnFailedTests: false
              testRunTitle: 'compat-live-${{ parameters.stage }}'

          - publish: out
            artifact: publish-${{ parameters.stage }}-$(Build.BuildId)
            displayName: Publish logs artifact
            condition: always()

          - bash: apic logout --server "$APIC_SERVER" || true
            displayName: apic logout
            condition: always()
            env:
              APIC_SERVER: $(APIC_SERVER)
