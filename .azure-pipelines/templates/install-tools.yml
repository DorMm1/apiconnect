# Installs the tools used by scripts/*.sh.
#
# Two modes, selected by the TOOLS_MODE variable (variable group apic-shared):
#   online  (default)  Microsoft-hosted ubuntu-latest agent: everything is downloaded (yamllint via pip,
#                      spectral via npm, yq/oasdiff from GitHub releases).
#   offline            Self-hosted on-prem agent prepared once with `sudo tools/install-offline.sh` from the
#                      offline bundle (yq, oasdiff, jq, standalone spectral, yamllint, and the apic toolkit
#                      on PATH). No network access is attempted; missing tools fail the job immediately.
#
# apic toolkit (online mode): for API Connect SaaS the CLI is downloaded from your tenant (API Manager ->
# "Tools for download"), it is not on a public URL. Upload it once as a Universal Package to Azure Artifacts:
#   az artifacts universal publish --organization <org-url> --feed platform-tools --name apic-toolkit \
#      --version 10.0.8.9 --path ./toolkit-dir      (toolkit-dir contains the linux `apic` binary)
# If `apic` is already on PATH the download is skipped in both modes.
parameters:
- name: apicFeed
  type: string
  default: platform-tools
- name: apicPackage
  type: string
  default: apic-toolkit

steps:
- bash: |
    set -euo pipefail
    chmod +x scripts/*.sh
    MODE="${TOOLS_MODE:-online}"
    echo "##vso[task.setvariable variable=TOOLS_MODE_EFFECTIVE]$MODE"
    if [[ "$MODE" == "offline" ]]; then
      missing=0
      for t in yamllint spectral yq oasdiff jq git realpath; do
        if command -v "$t" >/dev/null 2>&1; then printf '   %-9s %s\n' "$t" "$(command -v "$t")"; else echo "##vso[task.logissue type=error]offline mode: '$t' is not installed on this agent (run tools/install-offline.sh)"; missing=1; fi
      done
      (( missing == 0 )) || exit 1
    fi
  displayName: 'tools: mode'
  env:
    TOOLS_MODE: $(TOOLS_MODE)

- task: UsePythonVersion@0
  displayName: 'tools: python'
  condition: and(succeeded(), ne(variables['TOOLS_MODE_EFFECTIVE'], 'offline'))
  inputs:
    versionSpec: '3.x'

- task: NodeTool@0
  displayName: 'tools: node'
  condition: and(succeeded(), ne(variables['TOOLS_MODE_EFFECTIVE'], 'offline'))
  inputs:
    versionSpec: '20.x'

- bash: |
    set -euo pipefail
    pip install --quiet 'yamllint==1.*'
    npm install -g --silent '@stoplight/spectral-cli@6'
    # Pin the versions below to the ones you validated; bump deliberately.
    YQ_VERSION=v4.53.6
    OASDIFF_VERSION=1.32.1
    sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
    sudo chmod +x /usr/local/bin/yq
    curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
      | sudo tar -xz -C /usr/local/bin oasdiff
    sudo apt-get install -y -qq jq >/dev/null 2>&1 || true   # jq is preinstalled on hosted agents; no-op there
  displayName: 'tools: download yamllint / spectral / yq / oasdiff'
  condition: and(succeeded(), ne(variables['TOOLS_MODE_EFFECTIVE'], 'offline'))

- bash: |
    echo "yamllint $(yamllint --version | awk '{print $NF}') | spectral $(spectral --version) | yq $(yq --version | awk '{print $NF}') | oasdiff $(oasdiff --version | awk '{print $NF}') | jq $(jq --version)"
  displayName: 'tools: versions'

- bash: |
    if command -v apic >/dev/null 2>&1; then
      echo "apic already on PATH: $(command -v apic)"
      echo "##vso[task.setvariable variable=APIC_PRESENT]true"
    else
      echo "##vso[task.setvariable variable=APIC_PRESENT]false"
      if [[ "$(TOOLS_MODE_EFFECTIVE)" == "offline" ]]; then
        echo "##vso[task.logissue type=error]offline mode: the apic toolkit is not on PATH. Download it from API Manager -> Tools for download and install it on the agent."
        exit 1
      fi
    fi
  displayName: 'tools: detect apic'

- task: UniversalPackages@0
  displayName: 'tools: download apic toolkit $(APIC_TOOLKIT_VERSION)'
  condition: and(succeeded(), ne(variables['APIC_PRESENT'], 'true'))
  inputs:
    command: download
    vstsFeed: ${{ parameters.apicFeed }}
    vstsFeedPackage: ${{ parameters.apicPackage }}
    vstsPackageVersion: $(APIC_TOOLKIT_VERSION)
    downloadDirectory: $(Agent.ToolsDirectory)/apic

- bash: |
    set -euo pipefail
    if [[ "$(APIC_PRESENT)" != "true" ]]; then
      chmod +x "$(Agent.ToolsDirectory)/apic/apic"
      echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/apic"
      export PATH="$(Agent.ToolsDirectory)/apic:$PATH"
    fi
    apic --accept-license version
  displayName: 'tools: apic on PATH'
